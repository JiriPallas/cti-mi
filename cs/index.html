<script>
"use strict";
/* ČTI MI / READ-IT – webová verze 0.2 (alternativa k programu ČTI MI.exe)
   Dokumenty: složky z plochy, které pomocník jednou povolí (prohlížeč nedovolí povolit celou plochu).
   Dokument se pouze čte, nikdy se nezapisuje. Vše se ukládá jen v tomto prohlížeči. */
const VERZE = "0.1";
const PRIPONY = [".docx", ".txt"];
const T = { dvojklik: 1000, drzeni: 1000, krok: 1000, odskok: 100 };
const NAHLED_SLOV = 4, NAHLED_PAUZA_MS = 400;
const ORIENTACE_MIN = 15, VRATIT_PO_PAUZE_S = 300;
const J = JAZYKY[JAZYK] || JAZYKY.cs, TX = J.t;
const MAPPY = !!window.showDirectoryPicker;     // Windows (Edge/Chrome) ano, iPad/Safari ne
const UKAZKA_RYCHLOSTI = TX.ukazkaRychlosti;
const $ = id => document.getElementById(id);
document.documentElement.lang = J.lang.slice(0, 2); document.title = J.nazev;
for (const el of document.querySelectorAll("[data-t]")) el.innerHTML = el.dataset.t === "nazev" ? J.nazev : J.html[el.dataset.t];
let vyberOtevreny = false, nastaveniOtevrene = false, nahled = false;

/* ================================================================ dokument (port dokument.py) */
const ZKRATKY = new Set(J.zkratky.concat(["z.b", "usw", "bzw", "vgl", "nr", "ca", "evtl", "ggf", "inkl", "ff", "hr", "fr",
  "dt", "u.a", "d.h", "s.o", "s.u", "o.ä", "u.ä", "bspw", "etc"]));
const norm = t => t.split(/\s+/).filter(Boolean).join(" ");
const jeVelke = c => c !== c.toLowerCase() && c === c.toUpperCase();

function spanyVet(text) {
  const re = /([.!?…]+["“”»«')\]]*)\s+/g;
  const spany = []; let zac = 0, m;
  while ((m = re.exec(text))) {
    const konec = m.index + m[1].length;
    const dalsi = text.charAt(m.index + m[0].length);
    if (m[1][0] === ".") {
      const pred = text.slice(zac, m.index);
      const slovo = pred ? pred.split(/[\s(\["„“]/).pop() : "";
      if (/^\d{1,2}$/.test(slovo)) continue;              // „13. listopadu“ – řadová číslovka
      if (/^[IVXLC]+$/.test(slovo)) continue;             // „Karel IV.“
      if (ZKRATKY.has(slovo.toLowerCase().replace(/\.+$/, ""))) continue;
      if (/^\p{L}$/u.test(slovo)) continue;               // iniciály: J. Novák
    }
    if (dalsi && !(jeVelke(dalsi) || /\d/.test(dalsi) || "„\"«»“([–-".includes(dalsi))) continue;
    spany.push([zac, konec]); zac = m.index + m[0].length;
  }
  if (text.slice(zac).trim()) spany.push([zac, text.length]);
  return spany;
}
function rozdelNaVety(odstavec) {
  const t = norm(odstavec);
  return spanyVet(t).map(([a, b]) => t.slice(a, b).trim()).filter(Boolean);
}
function vyrobDokument(odstavce, strany, druh, konce) {
  const pocet = Math.max(1, ...strany.map(s => s.length ? Math.max(...s) : 1));
  return { odstavce, strany, konce: konce || strany.map(s => s.slice()), druh, pocet };
}
const NORMOSTRANA = 1800;
function normostrany(texty) {
  const odstavce = [], strany = [], konce = []; let znaku = 0;
  for (const t of texty) {
    const vety = rozdelNaVety(t); if (!vety.length) continue;
    const s = [], k = [];
    for (const v of vety) {
      s.push(1 + Math.floor(znaku / NORMOSTRANA));
      k.push(1 + Math.floor((znaku + Math.max(v.length - 1, 0)) / NORMOSTRANA));
      znaku += v.length + 1;
    }
    odstavce.push(vety); strany.push(s); konce.push(k);
  }
  return vyrobDokument(odstavce, strany, "normostrana", konce);
}
function odstavecSKonciStran(text, zlomy, strana) {
  const n = norm(text), spany = spanyVet(n);
  const zl = zlomy.map(z => norm(text.slice(0, z)).length).sort((a, b) => a - b);
  const vety = [], strany = [], konce = []; let i = 0;
  for (const [a, b] of spany) {
    while (i < zl.length && zl[i] <= a) { strana++; i++; }
    const v = n.slice(a, b).trim(); if (!v) continue;
    vety.push(v); strany.push(strana);
    while (i < zl.length && zl[i] < b) { strana++; i++; }
    konce.push(strana);
  }
  strana += zl.length - i;
  return [vety, strany, konce, strana];
}

async function rozbalZip(buf, jmeno) {           // jen čtení jednoho souboru ze ZIPu (.docx)
  const dv = new DataView(buf), u8 = new Uint8Array(buf), dec = new TextDecoder();
  let e = -1;
  for (let i = buf.byteLength - 22; i >= Math.max(0, buf.byteLength - 65557); i--)
    if (dv.getUint32(i, true) === 0x06054b50) { e = i; break; }
  if (e < 0) throw new Error(TX.nenWord);
  const pocet = dv.getUint16(e + 10, true); let p = dv.getUint32(e + 16, true);
  for (let k = 0; k < pocet; k++) {
    if (dv.getUint32(p, true) !== 0x02014b50) break;
    const metoda = dv.getUint16(p + 10, true), csize = dv.getUint32(p + 20, true);
    const nlen = dv.getUint16(p + 28, true), xlen = dv.getUint16(p + 30, true), klen = dv.getUint16(p + 32, true);
    const lho = dv.getUint32(p + 42, true);
    if (dec.decode(u8.subarray(p + 46, p + 46 + nlen)) === jmeno) {
      const start = lho + 30 + dv.getUint16(lho + 26, true) + dv.getUint16(lho + 28, true);
      const data = u8.subarray(start, start + csize);
      if (metoda === 0) return dec.decode(data);
      if (metoda === 8) return await new Response(new Blob([data]).stream()
                                 .pipeThrough(new DecompressionStream("deflate-raw"))).text();
      throw new Error(TX.neznamaKomprese);
    }
    p += 46 + nlen + xlen + klen;
  }
  throw new Error(TX.chybiText);
}

const W = "http://schemas.openxmlformats.org/wordprocessingml/2006/main";
async function nactiDocx(buf) {
  const xml = await rozbalZip(buf, "word/document.xml");
  const doc = new DOMParser().parseFromString(xml, "application/xml");
  const body = doc.getElementsByTagNameNS(W, "body")[0];
  if (!body) throw new Error(TX.nejdePrecist);
  const odstavceXml = [];
  for (const el of body.children) {
    if (el.namespaceURI !== W) continue;
    if (el.localName === "p") odstavceXml.push(el);
    else if (el.localName === "tbl") odstavceXml.push(...el.getElementsByTagNameNS(W, "p"));
  }
  const surove = []; let maZlomy = false;
  for (const p of odstavceXml) {
    const casti = [], zlomy = []; let delka = 0;
    (function projdi(el) {
      for (const c of el.children) {
        if (c.localName === "Fallback") continue;          // obsah textového pole by byl dvakrát
        if (c.namespaceURI === W) {
          if (c.localName === "t") { casti.push(c.textContent); delka += c.textContent.length; continue; }
          if (["tab", "br", "cr"].includes(c.localName)) { casti.push(" "); delka += 1; continue; }
          if (c.localName === "lastRenderedPageBreak") { zlomy.push(delka); maZlomy = true; continue; }
        }
        projdi(c);
      }
    })(p);
    surove.push([casti.join(""), zlomy]);
  }
  if (!maZlomy) return normostrany(surove.map(x => x[0]));
  const odstavce = [], strany = [], konce = []; let strana = 1;
  for (const [text, zlomy] of surove) {
    if (!text.trim()) { strana += zlomy.length; continue; }
    const [vety, s, k, nova] = odstavecSKonciStran(text, zlomy, strana); strana = nova;
    if (vety.length) { odstavce.push(vety); strany.push(s); konce.push(k); }
  }
  return vyrobDokument(odstavce, strany, "strana", konce);
}
function nactiTxt(buf) {
  let text;
  try { text = new TextDecoder("utf-8", { fatal: true }).decode(buf); }
  catch (e) { text = new TextDecoder(J.kodovaniTxt).decode(buf); }
  return normostrany(text.replace(/^﻿/, "").split(/\n\s*\n/).filter(o => o.trim()));
}
async function nactiDokument(file) {
  const n = file.name.toLowerCase();
  if (n.endsWith(".pdf")) throw new Error("PDF");
  const buf = await file.arrayBuffer();
  if (n.endsWith(".docx")) return await nactiDocx(buf);
  if (n.endsWith(".txt") || n.endsWith(".md")) return nactiTxt(buf);
  throw new Error(TX.typNeumim);
}

/* ================================================================ úložiště */
function nactiNast() { try { return JSON.parse(localStorage.getItem(J.lsKlic)) || {}; } catch (e) { return {}; } }
let nast = nactiNast();
function ulozNast() { try { localStorage.setItem(J.lsKlic, JSON.stringify(nast)); } catch (e) {} }

// složky a soubory (handly) se dají uložit jen do IndexedDB
const db = new Promise((ok, chyba) => {
  const r = indexedDB.open(J.dbJmeno, 1);
  r.onupgradeneeded = () => r.result.createObjectStore("data");
  r.onsuccess = () => ok(r.result); r.onerror = () => chyba(r.error);
});
async function dbCti(klic) {
  try { const d = await db; return await new Promise(ok => {
    const r = d.transaction("data").objectStore("data").get(klic); r.onsuccess = () => ok(r.result); r.onerror = () => ok(undefined); });
  } catch (e) { return undefined; }
}
async function dbPis(klic, hodnota) {
  try { const d = await db; await new Promise(ok => {
    const t = d.transaction("data", "readwrite"); t.objectStore("data").put(hodnota, klic); t.oncomplete = ok; t.onerror = ok; });
  } catch (e) {}
}

/* ================================================================ zvuky */
let audioCtx = null;
function pipni(tony) {
  try {
    audioCtx = audioCtx || new AudioContext();
    let t = audioCtx.currentTime;
    for (const [f, d] of tony) {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.frequency.value = f; o.connect(g); g.connect(audioCtx.destination);
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.3, t + 0.01);
      g.gain.setValueAtTime(0.3, t + d - 0.01); g.gain.linearRampToValueAtTime(0, t + d);
      o.start(t); o.stop(t + d); t += d;
    }
  } catch (e) {}
}
const zvuk = { tik: () => pipni([[880, 0.07]]), strana: () => pipni([[660, 0.08], [990, 0.10]]) };

/* ================================================================ hlas */
let hlasy = [], hlas = null, nahradniHlas = null;
const SYSTEM = "__system__";            // volba „hlas zařízení“ (iPad: webu nedá vylepšené hlasy, sám je ale použít může)
const kratkeJmeno = v => v.name.replace(/^(Microsoft|Google)\s+/i, "").split(/[\s(-]/)[0] || v.name;
function nactiHlasy() {
  if (!("speechSynthesis" in window)) return;
  hlasy = speechSynthesis.getVoices().filter(v => v.lang.toLowerCase().startsWith(J.hlasPrefix));
  // pořadí: uložená volba → přirozený online hlas (Edge) → kvalitní hlas iPadu (Premium/Vylepšený) → ostatní
  const kvalita = v => { const t = v.name + " " + (v.voiceURI || "");
    return (/natural|online/i.test(t) ? 40 : 0) + (/premium/i.test(t) ? 30 : 0) + (/enhanced|förbättrad|vylepšen|erweitert/i.test(t) ? 20 : 0)
         + (J.preferovanyHlas.test(v.name) ? 5 : 0) + (/compact|kompakt/i.test(t) ? -10 : 0); };
  hlasy.sort((a, b) => kvalita(b) - kvalita(a));
  if (nast.hlas === SYSTEM) hlas = null;                       // iPad: hlas vybere zařízení samo
  else hlas = hlasy.find(v => v.name === nast.hlas) || (kvalita(hlasy[0] || {name: ""}) > 0 ? hlasy[0] : null)
      || (!MAPPY ? null : hlasy.find(v => /natural|online/i.test(v.name)) || hlasy[0] || null);   // iPad bez lepšího hlasu → hlas zařízení
  nahradniHlas = hlasy.find(v => v.localService) || null;      // bez internetu (česky Jakub)
  if (nastaveniOtevrene) obnovNastaveni();
}
if ("speechSynthesis" in window) { nactiHlasy(); speechSynthesis.onvoiceschanged = nactiHlasy; }
let rychlost = typeof nast.rychlost === "number" ? nast.rychlost : 0;   // -1 … 1 jako v programu
const rate = () => rychlost >= 0 ? 1 + rychlost : 1 + rychlost / 2;    // 0,5× … 2×

let mluvId = 0, mluva = null;          // mluva = { id, text, potom, start, zacala, hotovo }
function mluv(text, potom = null) {
  const id = ++mluvId;
  mluva = { id, text, potom, start: performance.now(), zacala: false, hotovo: false, pokusu: 0, offline: false };
  if (!("speechSynthesis" in window)) { setTimeout(() => dokonceno(id), 50); return; }
  speechSynthesis.cancel();
  promluv(mluva);
}
function promluv(m) {
  const u = new SpeechSynthesisUtterance(m.text);
  u.lang = J.lang; u.rate = rate();
  const v = m.offline ? nahradniHlas : hlas; if (v) u.voice = v;
  u.onstart = () => { if (m.id === mluvId) m.zacala = true; };
  u.onend = () => dokonceno(m.id);
  u.onerror = e => {
    if (m.id !== mluvId || e.error === "interrupted" || e.error === "canceled") return;
    if (!m.offline && nahradniHlas && hlas && !hlas.localService) {   // přirozený hlas bez internetu
      m.offline = true; m.zacala = false; m.start = performance.now(); promluv(m); return;
    }
    dokonceno(m.id);
  };
  speechSynthesis.speak(u);
}
function dokonceno(id) {
  const m = mluva;
  if (!m || m.id !== id || m.hotovo) return;
  m.hotovo = true;
  if (m.potom) m.potom();
}
function ticho() { mluvId++; mluva = null; if ("speechSynthesis" in window) speechSynthesis.cancel(); }
setInterval(() => {          // pojistka: některé hlasy občas nedají vědět, že domluvily
  const m = mluva; if (!m || m.hotovo || !("speechSynthesis" in window)) return;
  const mluvi = speechSynthesis.speaking || speechSynthesis.pending, uplynulo = performance.now() - m.start;
  if (m.zacala && !mluvi && uplynulo > 800) dokonceno(m.id);
  else if (!m.zacala && !mluvi && uplynulo > 3000) {
    if (m.pokusu++ < 1) { m.start = performance.now(); promluv(m); } else dokonceno(m.id);
  }
}, 400);

/* ================================================================ stav */
let dok = null, odstavce = [], soubor = null;      // soubor = { handle, cesta:[složky], klic, otisk }

let skok = nast.skok || "strana", razeni = nast.razeni || "abeceda";
let pismo = nast.pismo || 32;
const tlNast = Object.assign({ dvojklik_ms: T.dvojklik, drzeni_ms: T.drzeni, krok_ms: T.krok, odskok_ms: T.odskok }, nast.tlacitko || {});
let koreny = [];      // [{ druh: "slozka"|"soubor", handle }]

function ukazStranku(id) {
  for (const s of ["cteni", "vyber", "nast"]) $(s).classList.toggle("ukazana", s === id);
}
function ukaz(veta, stav) { $("veta").textContent = veta; $("stav").textContent = stav; }
const strana = (oo = o, vv = v) => dok ? dok.strany[oo][vv] : 1;
const konecStrany = (oo = o, vv = v) => dok ? dok.konce[oo][vv] : 1;
function stranaOhlasena() {
  if (skokStrana && skokStrana[0] === o && skokStrana[1] === v) return skokStrana[2];
  return strana();
}
const nazevBezPripony = n => n.replace(/\.[^.]+$/, "");
function obnovDisplej() {
  $("b_cti").innerHTML = cte ? J.html.stop : J.html.cti;
  if (!odstavce.length) return;
  const s1 = strana(), s2 = konecStrany(), cislo = s2 > s1 ? `${s1}–${s2}` : `${s1}`;
  let stav = TX.stav(soubor ? soubor.handle.name : "", TX.druh[dok.druh] || dok.druh, cislo, dok.pocet, o + 1, odstavce.length, cte);
  if (varovani) stav = `${varovani}   ·   ${stav}`;

}
function ulozPozici() {
  if (soubor) { nast.pozice = nast.pozice || {}; nast.pozice[soubor.klic] = [o, v]; }
  nast.pismo = pismo; nast.rychlost = Math.round(rychlost * 100) / 100;

}
function rekni(text) { if (cte) return; mluv(text); }
function pozdeji(ms, akce) { const g = gen; setTimeout(() => { if (g === gen) akce(); }, ms); }

/* ================================================================ oprávnění ke složkám */
async function povol(h, mlcky = false) {
  try {
    if (await h.queryPermission({ mode: "read" }) === "granted") return true;
    if (!mlcky) rekni(TX.ptaSePovoleni);
    return await h.requestPermission({ mode: "read" }) === "granted";
  } catch (e) { return false; }
}
async function maPovoleni(h) { try { return await h.queryPermission({ mode: "read" }) === "granted"; } catch (e) { return false; } }
/* ---- iPad / Safari: prohlížeč nemá přístup ke složkám → dokumenty se vyberou v aplikaci Soubory
   a uloží se do aplikace (IndexedDB). Při dalším otevření jsou v seznamu, bez nového výběru. */
function obal(file) {        // uložený soubor se tváří jako handle ze systému souborů
  return { kind: "file", name: file.name, ulozeny: true, async getFile() { return file; },
           async queryPermission() { return "granted"; }, async requestPermission() { return "granted"; },
           async isSameEntry(x) { return !!x && x.ulozeny && x.name === file.name; } };
}
const zDb = k => k && k.druh === "ulozeny" ? { druh: "soubor", handle: obal(k.file), file: k.file } : k;
async function ulozKoreny() { await dbPis("koreny", koreny.map(k => k.file ? { druh: "ulozeny", file: k.file } : k)); }
async function ulozSoubory(files) {       // nové verze stejného jména nahradí starou
  for (const f of files) {
    koreny = koreny.filter(k => !(k.file && k.file.name === f.name));
    koreny.push({ druh: "soubor", handle: obal(f), file: f });
  }
  await ulozKoreny();
  return koreny.filter(k => k.file && files.some(f => f.name === k.file.name)).map(k => k.handle);
}
function vyberZeSouboru() {               // otevře aplikaci Soubory (iPad) / běžné okno pro výběr
  return new Promise(ok => {
    const i = document.createElement("input");
    i.type = "file"; i.multiple = true; i.style.display = "none"; document.body.appendChild(i);   // Safari chce prvek ve stránce
    setTimeout(() => i.remove(), 60000); i.accept = ".docx,.txt,application/vnd.openxmlformats-officedocument.wordprocessingml.document,text/plain";
    i.onchange = () => ok([...i.files].filter(f => jeDokument(f.name)));
    i.oncancel = () => ok([]);
    i.click();
  });
}
async function otevriNovy() {
  const files = await vyberZeSouboru();
  if (!files.length) return;
  const handly = await ulozSoubory(files);
  if (vyberOtevreny) zavriVyber();
  if (nastaveniOtevrene) { nastaveniOtevrene = false; ukazStranku("cteni"); }
  await otevri(handly[0], [], true);
}
async function pridejKoren(druh, handle) {
  for (const k of koreny) { try { if (await k.handle.isSameEntry(handle)) return k; } catch (e) {} }
  const k = { druh, handle }; koreny.push(k); await ulozKoreny(); return k;
}

/* ================================================================ výběr dokumentu */
const PLOCHA = { druh: "plocha" };
let vyberCesta = [];          // [] = plocha, jinak [kořenová složka, podsložka, …]
let vyberPolozky = [], vybrany = 0, vyberPredKlikem = 0;
const kol = new Intl.Collator(J.lang, { numeric: true, sensitivity: "base" });
const jeDokument = n => { const l = n.toLowerCase(); return PRIPONY.some(p => l.endsWith(p)) && !n.startsWith("~$") && !n.startsWith("."); };
const viditelna = n => !/^[.$~]/.test(n);
const jmenoPolozky = p => p.druh === "slozka" ? p.handle.name : nazevBezPripony(p.handle.name);
const kVysloveni = p => jmenoPolozky(p).replace(/[_-]/g, " ").trim();
function vyslovPolozku(p) {
  if (p.druh === "plocha") return TX.zpetNaPlochu;
  if (p.druh === "akce") return p.vyslov;
  return p.druh === "slozka" ? TX.slozka(kVysloveni(p)) : kVysloveni(p);
}

async function maDokumenty(dir, hloubka = 2) {
  try {
    const pod = [];
    for await (const h of dir.values()) {
      if (h.kind === "file" && jeDokument(h.name)) return true;
      if (h.kind === "directory" && viditelna(h.name)) pod.push(h);
    }
    if (hloubka > 1) for (const p of pod) if (await maDokumenty(p, hloubka - 1)) return true;
  } catch (e) {}
  return false;
}
async function seradSoubory(polozky) {
  if (razeni === "nejnovejsi") {
    for (const p of polozky) {
      p.cas = 0;
      try { if (await maPovoleni(p.handle)) p.cas = (await p.handle.getFile()).lastModified; } catch (e) {}
    }
    return polozky.sort((a, b) => b.cas - a.cas);
  }
  return polozky.sort((a, b) => kol.compare(jmenoPolozky(a), jmenoPolozky(b)));
}
async function obsahSlozky(cesta) {
  if (!cesta.length) {                    // plocha = povolené složky a jednotlivé dokumenty
    const soubory = koreny.filter(k => k.druh === "soubor").map(k => ({ druh: "soubor", handle: k.handle, cesta: [] }));
    const slozky = koreny.filter(k => k.druh === "slozka").map(k => ({ druh: "slozka", handle: k.handle, cesta: [] }));
    return (await seradSoubory(soubory)).concat(slozky.sort((a, b) => kol.compare(a.handle.name, b.handle.name)));
  }
  const dir = cesta[cesta.length - 1], soubory = [], slozky = [];
  for await (const h of dir.values()) {
    if (h.kind === "file" && jeDokument(h.name)) soubory.push({ druh: "soubor", handle: h, cesta });
    else if (h.kind === "directory" && viditelna(h.name) && await maDokumenty(h)) slozky.push({ druh: "slozka", handle: h, cesta });
  }
  return (await seradSoubory(soubory)).concat(slozky.sort((a, b) => kol.compare(a.handle.name, b.handle.name)));
}
function vykresliSeznam() {
  const ul = $("seznam"); ul.innerHTML = "";
  vyberPolozky.forEach((p, i) => {
    const li = document.createElement("li");
    li.textContent = p.druh === "plocha" ? TX.zpetNaPlochuSeznam : p.druh === "akce" ? p.text :
                     (p.druh === "slozka" ? "📁  " : "") + kVysloveni(p);
    if (i === vybrany) li.className = "vybrano";
    li.onclick = () => (p.druh === "akce" || (i === vybrany && !MAPPY)) ? vyberOtevri(i) : vyberNastav(i);   // iPad: 2. ťuknutí otevře
    li.ondblclick = () => vyberOtevri(i);
    ul.appendChild(li);
  });
  ul.children[vybrany]?.scrollIntoView({ block: "nearest" });
}
async function otevriVyber() {
  stop();
  vyberOtevreny = true; ukazStranku("vyber");
  let cesta = [], vybrat = null;
  if (soubor && soubor.cesta.length) { cesta = soubor.cesta; vybrat = soubor.handle; }
  await nactiSlozku(cesta, vybrat, true);
}
async function nactiSlozku(cesta, vybrat = null, uvodPlocha = false) {
  vyberCesta = cesta;
  const naPlose = !cesta.length;
  let polozky;
  try { polozky = await obsahSlozky(cesta); }
  catch (e) { polozky = []; }
  if (!naPlose) polozky.push(PLOCHA);
  if (naPlose && !MAPPY) {
    const novy = { druh: "akce", text: TX.otevritNovy, vyslov: TX.otevritNovyRec, akce: otevriNovy };
    if (polozky.length) polozky.push(novy); else polozky = [novy, { druh: "akce", text: TX.nastaveniSeznam, vyslov: TX.nastaveniRec, akce: otevriNastaveni }];
  }
  if (naPlose && !polozky.length) polozky = [
    { druh: "akce", text: TX.pridatSlozkuZPlochy, vyslov: TX.pridatSlozkuZPlochyRec, akce: pridejSlozku },
    { druh: "akce", text: TX.nastaveniSeznam, vyslov: TX.nastaveniRec, akce: otevriNastaveni }];
  vyberPolozky = polozky; vybrany = 0;
  const dokum = polozky.filter(p => p.druh === "soubor").length, slo = polozky.filter(p => p.druh === "slozka").length;
  $("v_nadpis").textContent = (naPlose ? TX.plocha : "📁  " + cesta[cesta.length - 1].name.toUpperCase()) +
                              `   ·   ${dokum} ${TX.dok}` + (slo ? `  ·  ${slo} ${TX.slozZkr}` : "");
  vykresliSeznam();
  if (polozky[0].druh === "akce") {
    $("v_nadpis").textContent = MAPPY ? TX.zadneSlozky : TX.plocha;
    vyberNastav(0, MAPPY ? TX.zadneDokumenty : TX.zadneDokumentyIpad);
    return;
  }
  const casti = uvodPlocha ? [TX.vyberteDokument] : [];
  if (!naPlose) casti.push(TX.slozka(cesta[cesta.length - 1].name.replace(/[_-]/g, " ")) + ".");
  if (naPlose && !uvodPlocha) casti.push(TX.plochaRec);
  if (dokum) casti.push(TX.dokumentu(dokum) + ".");
  if (slo) casti.push(TX.slozek(slo) + ".");
  let index = 0;
  if (vybrat) for (let i = 0; i < polozky.length; i++) {
    try { if (polozky[i].handle && await polozky[i].handle.isSameEntry(vybrat)) index = i; } catch (e) {}
  }
  vyberNastav(index, casti.join(" "));
}
function vyberNastav(i, uvod = "", jeNahled = false) {
  if (!vyberPolozky.length) return;
  vybrany = i; vykresliSeznam();
  const text = (uvod ? uvod + " " : "") + vyslovPolozku(vyberPolozky[i]);
  nahled = jeNahled;
  mluv(text, jeNahled ? poNahledu : null);
}
function vyberPosun(krok, jeNahled = false) {
  if (!vyberPolozky.length) return false;
  const i = vybrany + krok;
  if (i >= vyberPolozky.length) { zvuk.strana(); vyberNastav(0, TX.zacatekSeznamu, jeNahled); return true; }
  if (i < 0) { vyberNastav(0, TX.zacatekSeznamu, false); return false; }
  vyberNastav(i, "", jeNahled); return true;
}
async function vyberNaPlochu() {
  if (!vyberCesta.length) { rekni(TX.uzNaPlose); return; }
  await nactiSlozku([], vyberCesta[0]);
}
async function vyberOtevri(i = vybrany) {
  const cil = vyberPolozky[i]; if (!cil) return;
  if (cil.druh === "plocha") { await vyberNaPlochu(); return; }
  if (cil.druh === "akce") { await cil.akce(); if (vyberOtevreny && !nastaveniOtevrene) await nactiSlozku([]); return; }
  if (cil.druh === "slozka") {
    if (!cil.cesta.length && !await povol(cil.handle)) { rekni(TX.bezPovoleniSlozka); return; }
    await nactiSlozku(cil.cesta.concat([cil.handle])); return;
  }
  if (!cil.cesta.length && !await povol(cil.handle)) { rekni(TX.bezPovoleniDokument); return; }
  zavriVyber();
  await otevri(cil.handle, cil.cesta, true);
}
function zavriVyber() { vyberOtevreny = false; nahled = false; ticho(); ukazStranku("cteni"); }
function vyberZrus() { zavriVyber(); obnovDisplej(); if (!dok) ukazPrazdne(); rekni(dok ? TX.zpetKeCteni : TX.zadnyDokument); }
function ukazPrazdne() {
  if (!MAPPY) { ukaz(TX.prazdneIpad, ""); return; }
  ukaz(TX.prazdne, "");
}
async function odeberZPlochy() {          // klávesa Delete na ploše – pro pomocníka
  const p = vyberPolozky[vybrany];
  if (vyberCesta.length || !p || p.druh === "plocha" || p.druh === "akce") return;
  koreny = koreny.filter(k => k.handle !== p.handle); await ulozKoreny();
  await nactiSlozku([]); rekni(TX.odebrano);
}

/* ================================================================ otevření a čtení */
const klicSouboru = (cesta, h) => cesta.map(d => d.name).join("/") + "/" + h.name;
const otisk = f => f.lastModified + ":" + f.size;
async function prectiSoubor(handle) {
  const f = await handle.getFile();
  return [await nactiDokument(f), otisk(f)];
}
function hlasChyby(e) {
  if (e && e.message === "PDF") return TX.pdf;
  if (e && (e.name === "NotReadableError" || e.name === "NoModificationAllowedError")) return TX.zamceny;
  if (e && e.name === "NotFoundError") return TX.neniTam;
  return [TX.neotevren[0] + (e && e.message || ""), TX.neotevren[1]];
}
async function otevri(handle, cesta, cist) {
  stop();
  let novy, ot;
  try { [novy, ot] = await prectiSoubor(handle); }
  catch (e) { const [t, h] = hlasChyby(e); ukaz(t, TX.nejdeOtevrit); rekni(h); return false; }
  if (!novy.odstavce.length) { ukaz(TX.zadnyText, TX.prazdnyDokument); rekni(TX.zadnyText); return false; }
  ulozPozici();
  soubor = { handle, cesta, klic: klicSouboru(cesta, handle), otisk: ot };
  casOrientace = 0; dok = novy; odstavce = novy.odstavce; skokStrana = null;
  o = 0; v = 0;
  const poz = (nast.pozice || {})[soubor.klic];
  if (poz && poz[0] < odstavce.length && poz[1] < odstavce[poz[0]].length) [o, v] = poz;
  nast.posledni = soubor.klic; ulozPozici();
  await dbPis("posledni", handle.ulozeny ? { ulozeny: handle.name } : { handle, cesta });
  obnovDisplej();
  if (cist) await cti();
  return true;
}

function podobnost(a, b) {                // jako difflib: 2 × shoda / součet délek
  const c = t => t.toLowerCase().replace(/[ .!?…,;:"“”»«]+$/, "");
  a = c(a); b = c(b);
  if (a && b && (a.startsWith(b) || b.startsWith(a))) return 0.95;
  if (!a.length || !b.length) return 0;
  let pred = new Uint16Array(b.length + 1), ted = new Uint16Array(b.length + 1);
  for (let i = 1; i <= a.length; i++) {
    for (let j = 1; j <= b.length; j++)
      ted[j] = a[i - 1] === b[j - 1] ? pred[j - 1] + 1 : Math.max(pred[j], ted[j - 1]);
    [pred, ted] = [ted, pred];
  }
  return 2 * pred[b.length] / (a.length + b.length);
}
async function zkontrolujZmenu() {
  if (!soubor) return;
  let f; try { f = await soubor.handle.getFile(); } catch (e) { return; }
  const ot = otisk(f); if (ot === soubor.otisk) return;
  let novy; try { novy = await nactiDokument(f); } catch (e) { return; }   // Word právě ukládá
  if (!novy.odstavce.length) return;
  const stare = odstavce.flat();
  const index = odstavce.slice(0, o).reduce((s, x) => s + x.length, 0) + v;
  const hledana = stare[index] || "";
  const pozice = []; novy.odstavce.forEach((vety, oo) => vety.forEach((_, vv) => pozice.push([oo, vv])));
  const nove = pozice.map(([oo, vv]) => novy.odstavce[oo][vv]);
  let cil = null;
  for (let vz = 0; vz < nove.length && cil === null; vz++)
    for (const j of [index - vz, index + vz]) if (j >= 0 && j < nove.length && nove[j] === hledana) { cil = j; break; }
  if (cil === null && hledana) {
    let nejlepsi = 0.6;
    for (let j = Math.max(0, index - 60); j < Math.min(nove.length, index + 60); j++) {
      const sk = podobnost(hledana, nove[j]) - 0.005 * Math.abs(j - index);
      if (sk > nejlepsi) { nejlepsi = sk; cil = j; }
    }
  }
  if (cil === null) cil = Math.min(index, nove.length - 1);
  dok = novy; odstavce = novy.odstavce; [o, v] = pozice[cil];
  soubor.otisk = ot; skokStrana = null; ohlasitZmenu = true;
  ulozPozici(); obnovDisplej();
}

function rekniVetu() {
  let text = odstavce[o][v];
  if (ohlasitStranu) { ohlasitStranu = false; text = `${TX.stranaRec(stranaOhlasena())}. ${text}`; }
  if (ohlasitNazev) {
    ohlasitNazev = false; casOrientace = performance.now();
    text = `${TX.cteme(nazevBezPripony(soubor.handle.name).replace(/_/g, " "), stranaOhlasena())} ${odstavce[o][v]}`;
  }
  if (ohlasitZmenu) { ohlasitZmenu = false; text = `${TX.zmenen} ${text}`; }
  const g = gen;
  mluv(text, () => { if (g === gen) poVete(); });
}
function poVete() {
  if (!cte) return;
  const stara = strana();
  if (posunVetu(+1)) {
    if (strana() !== stara) { zvuk.strana(); pozdeji(350, rekniVetu); }
    else rekniVetu();
  } else {
    cte = false; gen++; obnovDisplej();
    setTimeout(() => rekni(TX.konecDokumentu), 200);
  }
}
async function cti() {
  if (!odstavce.length) return;
  const g = ++gen;
  await zkontrolujZmenu();
  if (g !== gen) return;                     // mezitím STOP
  const pauza = (performance.now() - casStop) / 1000;
  if (casStop && pauza >= VRATIT_PO_PAUZE_S) posunVetu(-1);
  const interval = 60000 * (nast.orientace_min || ORIENTACE_MIN);
  if (!casOrientace || performance.now() - casOrientace >= interval) ohlasitNazev = true;
  cte = true; obnovDisplej(); rekniVetu();
}
function stop() {
  if (cte) casStop = performance.now();
  gen++; cte = false; ticho(); obnovDisplej();
}
function ctiStop() { cte ? stop() : cti(); }
function posunVetu(krok) {
  let oo = o, vv = v + krok;
  if (vv >= odstavce[oo].length) { oo++; vv = 0; }
  else if (vv < 0) { oo--; if (oo >= 0) vv = odstavce[oo].length - 1; }
  if (oo < 0 || oo >= odstavce.length) return false;
  o = oo; v = vv; ulozPozici(); obnovDisplej(); return true;
}
function skoc(posun, ohlasit = true) {
  if (!odstavce.length) return;
  const cetl = cte, stara = stranaOhlasena();
  if (cetl) { stop(); casStop = 0; }
  posun();
  if (ohlasit) ohlasitStranu = true;
  if (cetl) pozdeji(80, cti);
  else { obnovDisplej(); if (ohlasit && stranaOhlasena() !== stara) rekni(TX.stranaRec(stranaOhlasena())); }
}
const predchoziVeta = () => skoc(() => posunVetu(-1), false);
const dalsiVeta = () => skoc(() => posunVetu(+1), false);
const zopakuj = () => cte ? skoc(() => {}, false) : cti();
function odstavecZpet() { if (v > 0) v = 0; else if (o > 0) { o--; v = 0; } ulozPozici(); }
function odstavecDal() { if (o < odstavce.length - 1) { o++; v = 0; } ulozPozici(); }
function vsechnyPozice() { const p = []; odstavce.forEach((vety, oo) => vety.forEach((_, vv) => p.push([oo, vv]))); return p; }
function zacatekStrany(poz, cil) {
  for (let j = 0; j < poz.length; j++) if (konecStrany(...poz[j]) >= cil) return j;
  return poz.length - 1;
}
function stranaZpet() {
  const poz = vsechnyPozice(), i = poz.findIndex(p => p[0] === o && p[1] === v);
  let cur = stranaOhlasena(), j = zacatekStrany(poz, cur);
  if (j >= i && cur > 1) { cur--; j = zacatekStrany(poz, cur); }
  [o, v] = poz[Math.min(j, i)]; skokStrana = [o, v, cur]; ulozPozici();
}
function stranaDal() {
  const poz = vsechnyPozice(), i = poz.findIndex(p => p[0] === o && p[1] === v), cil = stranaOhlasena() + 1;
  for (let j = i; j < poz.length; j++) if (konecStrany(...poz[j]) >= cil) { [o, v] = poz[j]; skokStrana = [o, v, cil]; break; }
  ulozPozici();
}
const skokZpet = () => skok === "strana" ? stranaZpet() : odstavecZpet();
const skokDal = () => skok === "strana" ? stranaDal() : odstavecDal();
const predchoziSkok = () => skoc(skokZpet);
const dalsiSkok = () => skoc(skokDal);

/* ================================================================ nastavení */
function obnovNastaveni() {
  $("n_rychlost").textContent = TX.rychlostCteni(`${rychlost >= 0 ? "+" : ""}${Math.round(rychlost * 100)} %`);
  $("n_hlas").textContent = hlas ? "🔊  " + kratkeJmeno(hlas).toUpperCase() : (!MAPPY || hlasy.length ? TX.systemHlas : TX.zadnyHlas);
  $("n_hlas_popis").textContent = TX.hlasPopis(volbyHlasu().length > 1) + (hlas && !hlas.localService ? TX.hlasOnline : "");
  const zaklady = { n_odstavec: ["odstavec", J.html.odstavcich], n_strana: ["strana", J.html.strankach],
                    n_abeceda: ["abeceda", J.html.abecedne], n_nejnovejsi: ["nejnovejsi", J.html.nejnovejsi] };
  for (const [id, [klic, text]] of Object.entries(zaklady)) {
    const zvol = klic === skok || klic === razeni;
    $(id).textContent = (zvol ? "✓  " : "") + text; $(id).classList.toggle("zvoleno", zvol);
  }
  $("n_vymaz").innerHTML = J.html.vymazat; vymazCas = -1e9;
  $("n_upozorneni").style.display = skok === "strana" ? "" : "none";
  const slo = koreny.filter(k => k.druh === "slozka").length, sou = koreny.length - slo;
  $("n_slozky").textContent = TX.proPomocnika(slo, sou);
  obnovSkokTlacitka();
}
function obnovSkokTlacitka() {
  const slovo = skok === "strana" ? J.html.skokStrana : J.html.skokOdstavec;
  $("b_odstzpet").innerHTML = `⏮&nbsp; ${slovo}`; $("b_odstdal").innerHTML = `${slovo}&nbsp; ⏭`;
}
function otevriNastaveni() {
  stop(); if (vyberOtevreny) zavriVyber();
  nastaveniOtevrene = true; obnovNastaveni(); ukazStranku("nast"); rekni(TX.nastaveni);
}
function zavriNastaveni() { nastaveniOtevrene = false; ticho(); ukazStranku("cteni"); obnovDisplej(); if (!dok) ukazPrazdne(); rekni(TX.hotovo); }
function ukazkaRychlosti() {
  let text = UKAZKA_RYCHLOSTI;
  if (odstavce.length) { text = odstavce[o].slice(v, v + 2).join(" "); if (text.length > 220) text = text.slice(0, 220).replace(/\s\S*$/, "") + "…"; }
  mluv(text);
}
function zmenRychlost(krok) {
  rychlost = Math.max(-1, Math.min(1, Math.round((rychlost + krok) * 10) / 10));
  ulozPozici();
  $("stav").textContent = TX.rychlostStav(`${rychlost >= 0 ? "+" : ""}${Math.round(rychlost * 100)} %`);
  if (nastaveniOtevrene) { obnovNastaveni(); ukazkaRychlosti(); return; }
  if (cte) skoc(() => {}, false); else rekni(krok > 0 ? TX.rychleji : TX.pomaleji);
}
const volbyHlasu = () => MAPPY ? hlasy : [null, ...hlasy];      // na iPadu navíc „hlas zařízení“
function dalsiHlas() {
  const volby = volbyHlasu();
  if (!volby.length) { rekni(TX.chybiHlas); return; }
  hlas = volby[(volby.indexOf(hlas) + 1) % volby.length];
  nast.hlas = hlas ? hlas.name : SYSTEM; ulozNast(); obnovNastaveni();
  mluv(hlas ? TX.hlasUkazka(kratkeJmeno(hlas)) : TX.systemUkazka);
}
function nastavSkok(s) {
  skok = s; nast.skok = s; ulozNast(); obnovNastaveni();
  rekni(s === "strana" ? TX.poStrankach : TX.poOdstavcich);
}
function nastavRazeni(r) { razeni = r; nast.razeni = r; ulozNast(); obnovNastaveni(); rekni(r === "abeceda" ? TX.abecedne : TX.nejnovejsi); }
async function pridejSlozku() {
  if (!window.showDirectoryPicker) { rekni(TX.neumiSlozky); return; }
  try {
    const h = await showDirectoryPicker({ id: "cti", mode: "read", startIn: "desktop" });
    await pridejKoren("slozka", h); obnovNastaveni(); rekni(TX.slozkaPridana(h.name));
  } catch (e) { if (e.name !== "AbortError") rekni(TX.slozkaNedovolena); }
}
async function pridejSoubor() {
  if (!window.showOpenFilePicker) {
    const files = await vyberZeSouboru(); if (!files.length) return;
    await ulozSoubory(files); obnovNastaveni(); rekni(TX.dokumentPridan(files.length)); return;
  }
  try {
    const hs = await showOpenFilePicker({ id: "cti", startIn: "desktop", multiple: true, types: [{ description: TX.popisDokumentu,
      accept: { "application/vnd.openxmlformats-officedocument.wordprocessingml.document": [".docx"], "text/plain": [".txt"] } }] });
    for (const h of hs) await pridejKoren("soubor", h);
    obnovNastaveni(); rekni(TX.dokumentPridan(hs.length));
  } catch (e) { if (e.name !== "AbortError") rekni(TX.dokumentNepridan); }
}

/* ================================================================ jedno tlačítko (mezerník) */
const tl = { drzi: false, ignoruj: false, cetl: false, kroku: 0, pusteno: -1e9, posledniKlik: -1e9, casovac: null, naZacatku: false };
function poNahledu() { nahled = false; if (tl.drzi) { clearTimeout(tl.casovac); tl.casovac = setTimeout(drzeni, NAHLED_PAUZA_MS); } }
function tlDolu() {
  const t = performance.now();
  if (t - tl.pusteno < tlNast.odskok_ms) { tl.ignoruj = true; return; }
  tl.ignoruj = false; tl.drzi = true; tl.kroku = 0;
  if (nastaveniOtevrene) return;                    // v nastavení: puštění = zavřít
  clearTimeout(tl.casovac);
  if (vyberOtevreny) { tl.casovac = setTimeout(drzeni, tlNast.drzeni_ms); return; }
  tl.naZacatku = false; tl.cetl = cte;
  if (cte) stop();                                  // STOP okamžitě při stisku
  tl.casovac = setTimeout(drzeni, tlNast.drzeni_ms);
}
function drzeni() {
  if (!tl.drzi) return;
  if (vyberOtevreny) {
    tl.kroku++; zvuk.tik();
    if (vyberPosun(-1, true)) tl.casovac = setTimeout(drzeni, Math.max(tlNast.krok_ms, 4000));   // pojistka
    return;
  }
  if (!odstavce.length) return;
  if (cte) stop();
  tl.kroku++;
  let text;
  if (posunVetu(-1)) { zvuk.tik(); text = odstavce[o][v].split(" ").slice(0, NAHLED_SLOV).join(" "); }
  else if (!tl.naZacatku) { tl.naZacatku = true; text = TX.zacatekDokumentu; }
  else return;
  nahled = true; mluv(text, poNahledu);
  clearTimeout(tl.casovac); tl.casovac = setTimeout(drzeni, Math.max(tlNast.krok_ms, 4000));
}
function tlNahoru() {
  if (tl.ignoruj) { tl.ignoruj = false; return; }
  if (!tl.drzi) return;
  tl.drzi = false; clearTimeout(tl.casovac);
  const t = performance.now(); tl.pusteno = t;
  if (nastaveniOtevrene) { zavriNastaveni(); return; }
  if (vyberOtevreny) {
    if (tl.kroku > 0) { nahled = false; tl.posledniKlik = -1e9; return; }
    if (t - tl.posledniKlik <= tlNast.dvojklik_ms) { tl.posledniKlik = -1e9; vyberOtevri(vyberPredKlikem); return; }
    tl.posledniKlik = t; vyberPredKlikem = vybrany; vyberPosun(+1); return;
  }
  if (!odstavce.length) { otevriVyber(); return; }
  if (tl.kroku > 0) {                               // konec držení → čti odtud
    tl.posledniKlik = -1e9; casStop = 0; nahled = false; ticho();
    ohlasitStranu = true; pozdeji(80, cti); return;
  }
  if (t - tl.posledniKlik <= tlNast.dvojklik_ms) {  // dvojklik → odstavec / stránka dál a čti
    tl.posledniKlik = -1e9; stop(); casStop = 0; skokDal(); ohlasitStranu = true; cti(); return;
  }
  tl.posledniKlik = t;
  if (!tl.cetl) cti();                              // (pokud se četlo, zastavil už stisk)
}

/* ================================================================ klávesy a tlačítka */
let spusteno = false;
function podle(cteni, vyber) {
  return () => { if (nastaveniOtevrene) return; if (vyberOtevreny) { if (vyber) vyber(); } else cteni(); };
}
const KLAVESY = {
  Numpad5: podle(ctiStop, () => vyberOtevri()), Digit5: podle(ctiStop, () => vyberOtevri()),
  ArrowLeft: podle(predchoziVeta, () => vyberPosun(-1)), Numpad4: podle(predchoziVeta, () => vyberPosun(-1)),
  ArrowRight: podle(dalsiVeta, () => vyberPosun(+1)), Numpad6: podle(dalsiVeta, () => vyberPosun(+1)),
  ArrowUp: podle(predchoziSkok, () => vyberPosun(-1)), Numpad8: podle(predchoziSkok, () => vyberPosun(-1)),
  ArrowDown: podle(dalsiSkok, () => vyberPosun(+1)), Numpad2: podle(dalsiSkok, () => vyberPosun(+1)),
  Enter: podle(zopakuj, () => vyberOtevri()), NumpadEnter: podle(zopakuj, () => vyberOtevri()),
  Numpad0: podle(zopakuj, () => vyberOtevri()),
  NumpadAdd: () => zmenRychlost(+0.1), NumpadSubtract: () => zmenRychlost(-0.1),
  Escape: () => nastaveniOtevrene ? zavriNastaveni() : (vyberOtevreny ? vyberZrus() : null),
  Delete: () => { if (vyberOtevreny) odeberZPlochy(); },
};
document.addEventListener("keydown", e => {
  if (!spusteno) {                 // klávesy prohlížeče (Ctrl+Shift+R, F5 …) nechat projít
    if (e.ctrlKey || e.altKey || e.metaKey || /^F\d+$/.test(e.key) || ["Control", "Shift", "Alt", "Meta"].includes(e.key)) return;
    e.preventDefault(); start(); return;
  }
  if (e.code === "Space") { e.preventDefault(); if (!e.repeat) tlDolu(); return; }
  if (e.ctrlKey && (e.key === "+" || e.key === "=")) { e.preventDefault(); pismo = Math.min(72, pismo + 4); nastavPismo(); ulozPozici(); return; }
  if (e.ctrlKey && e.key === "-") { e.preventDefault(); pismo = Math.max(16, pismo - 4); nastavPismo(); ulozPozici(); return; }
  if (e.ctrlKey && e.key.toLowerCase() === "o") { e.preventDefault(); pridejSoubor(); return; }
  if (e.ctrlKey || e.altKey || e.metaKey) return;
  if (e.key === "+") { e.preventDefault(); zmenRychlost(+0.1); return; }
  if (e.key === "-") { e.preventDefault(); zmenRychlost(-0.1); return; }
  const akce = KLAVESY[e.code];
  if (akce) { e.preventDefault(); akce(); }
});
document.addEventListener("keyup", e => { if (spusteno && e.code === "Space") { e.preventDefault(); tlNahoru(); } });
const klik = (id, f) => { $(id).onclick = () => f(); $(id).onkeydown = e => { if (e.code === "Space" || e.code === "Enter") e.preventDefault(); }; };
klik("b_zpet", predchoziVeta); klik("b_dal", dalsiVeta);
klik("b_odstzpet", predchoziSkok); klik("b_odstdal", dalsiSkok);
klik("b_cti", ctiStop); klik("b_nast", otevriNastaveni); klik("b_otevrit", otevriVyber);
klik("b_zavrit", () => { stop(); ulozPozici(); window.close(); ukaz(TX.oknoZavrit, ""); });
klik("v_pred", () => vyberPosun(-1)); klik("v_dalsi", () => vyberPosun(+1));
klik("v_cti", () => vyberOtevri()); klik("v_zpet", vyberZrus);
klik("n_pomaleji", () => zmenRychlost(-0.1)); klik("n_rychleji", () => zmenRychlost(+0.1));
klik("n_hlas", dalsiHlas);
klik("n_odstavec", () => nastavSkok("odstavec")); klik("n_strana", () => nastavSkok("strana"));
klik("n_abeceda", () => nastavRazeni("abeceda")); klik("n_nejnovejsi", () => nastavRazeni("nejnovejsi"));
klik("n_pridej_slozku", pridejSlozku); klik("n_pridej_soubor", pridejSoubor);
klik("n_hotovo", zavriNastaveni);
let vymazCas = -1e9;
klik("n_vymaz", async () => {        // pro pomocníka: vše zapomenout (dokumenty na disku zůstávají)
  if (performance.now() - vymazCas > 4000) {
    vymazCas = performance.now(); $("n_vymaz").textContent = J.html.opravdu;
    rekni(TX.opravduVymazat); return;
  }
  stop();
  try { for (const k of Object.keys(localStorage)) if (k.startsWith(J.lsPrefix)) localStorage.removeItem(k); } catch (e) {}
  await dbPis("koreny", []); await dbPis("posledni", null);
  location.reload();
});
for (const b of document.querySelectorAll("button")) b.tabIndex = -1;   // mezerník ovládá čtení, ne tlačítko
$("uvod").onclick = () => start();
window.addEventListener("pagehide", ulozPozici);

/* ================================================================ přetažení dokumentu nebo složky */
let pretahHloubka = 0;
const jsouSoubory = e => [...(e.dataTransfer?.types || [])].includes("Files");
document.addEventListener("dragenter", e => { if (!jsouSoubory(e)) return; e.preventDefault(); pretahHloubka++; $("pretah").classList.add("ukazana"); });
document.addEventListener("dragover", e => { if (jsouSoubory(e)) e.preventDefault(); });
document.addEventListener("dragleave", e => { if (--pretahHloubka <= 0) { pretahHloubka = 0; $("pretah").classList.remove("ukazana"); } });
document.addEventListener("drop", async e => {
  e.preventDefault(); pretahHloubka = 0; $("pretah").classList.remove("ukazana");
  const sliby = [...e.dataTransfer.items].filter(i => i.kind === "file" && i.getAsFileSystemHandle).map(i => i.getAsFileSystemHandle());
  if (!spusteno) await start(true);
  let handly = (await Promise.all(sliby)).filter(Boolean);
  if (!handly.length) {
    const files = [...e.dataTransfer.files].filter(f => jeDokument(f.name));
    if (files.length) { const h = await ulozSoubory(files); if (vyberOtevreny) zavriVyber(); await otevri(h[0], [], true); return; }
  }
  let prvniSoubor = null, slozek = 0;
  for (const h of handly) {
    if (h.kind === "directory") { await pridejKoren("slozka", h); slozek++; }
    else if (h.name.toLowerCase().endsWith(".pdf")) rekni(TX.pdf[1]);
    else if (jeDokument(h.name)) { await pridejKoren("soubor", h); prvniSoubor = prvniSoubor || h; }
  }
  if (nastaveniOtevrene) obnovNastaveni();
  if (prvniSoubor) { if (vyberOtevreny) zavriVyber(); if (nastaveniOtevrene) { nastaveniOtevrene = false; ukazStranku("cteni"); } await otevri(prvniSoubor, [], true); }
  else if (slozek) rekni(TX.slozkyPridany(slozek));
});

/* ================================================================ start */
async function start(tise = false) {
  if (spusteno) return;
  spusteno = true;
  $("uvod").remove();
  koreny = ((await dbCti("koreny")) || []).map(zDb);
  if (tise) return;
  const posl = await dbCti("posledni");
  if (posl && posl.ulozeny) {
    const k = koreny.find(x => x.file && x.file.name === posl.ulozeny);
    if (k && await otevri(k.handle, [], false)) { rekni(TX.vitej); return; }
  }
  if (posl && posl.handle) {
    const koren = posl.cesta && posl.cesta[0];
    if (await povol(koren || posl.handle) && await otevri(posl.handle, posl.cesta || [], false)) { rekni(TX.vitej); return; }
  }
  ukazPrazdne();
  await otevriVyber();
}
nastavPismo(); obnovSkokTlacitka(); obnovDisplej();
if (!MAPPY) $("n_pridej_slozku").style.display = "none";     // iPad: složky nejdou, jen dokumenty
if ("serviceWorker" in navigator) navigator.serviceWorker.register(ZAKLAD + "sw.js").catch(() => {});
